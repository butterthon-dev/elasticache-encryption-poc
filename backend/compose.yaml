services:
  api:
    build:
      context: .
      dockerfile: Dockerfile 
      args:
        DEVELOPMENT: 1
    environment:
      - DJANGO_SETTINGS_MODULE: "config.local"
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    tty: true

  redis:
    image: redis:7.4.11
    ports:
      - "6379:6379"
