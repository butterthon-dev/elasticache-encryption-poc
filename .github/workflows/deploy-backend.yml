name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# OIDCでAWSのロールをAssumeするためにid-token: writeが必要
permissions:
  contents: read
  id-token: write

# 同じブランチのデプロイが同時に走らないようにする（実行中のデプロイはキャンセルしない）
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: dev-elasticache-poc-repo-backend
  ECS_CLUSTER: dev-elasticache-poc-cluster-main
  ECS_SERVICE: dev-elasticache-poc-service-backend
  CONTAINER_NAME: api
  TASK_DEFINITION_FILE: backend/aws/task-definition/task.json

jobs:
  deploy:
    name: Build and deploy to ECS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-deploy-backend
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Fargate（X86_64）で動かすため、プラットフォームをlinux/amd64に固定する。
      # provenanceを無効にしているのは、attestation用のマニフェストが付くとECSのイメージ取得で問題になるため。
      - name: Build and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # タスク定義にはアカウントIDを含むARNが必要だが、リポジトリには保持しないため
      # プレースホルダーをAssumeしたロールのアカウントIDとリージョンで置換する
      - name: Fill in task definition placeholders
        id: task-definition
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws-credentials.outputs.aws-account-id }}
        run: |
          set -euo pipefail
          rendered="${RUNNER_TEMP}/task-definition.json"
          sed \
            -e "s|__AWS_ACCOUNT_ID__|${AWS_ACCOUNT_ID}|g" \
            -e "s|__AWS_REGION__|${AWS_REGION}|g" \
            "${TASK_DEFINITION_FILE}" > "${rendered}"
          echo "path=${rendered}" >> "$GITHUB_OUTPUT"

      - name: Render new image into task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task-definition.outputs.path }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy task definition to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
